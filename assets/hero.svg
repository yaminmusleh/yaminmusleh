<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
  <title id="title">Yamen Mosleh — Full-Stack Developer</title>
  <desc id="desc">Terminal-style banner: web, C++ systems, and Godot game development.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#151b27"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#a371f7"/>
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .line { animation: in .6s ease both; }
      .l1 { animation-delay: .2s; }
      .l2 { animation-delay: .8s; }
      .l3 { animation-delay: 1.4s; }
      .l4 { animation-delay: 2s; }
      @keyframes in { from { opacity: 0; } to { opacity: 1; } }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <rect width="900" height="300" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="298" rx="15" fill="none" stroke="#30363d"/>

  <circle cx="28" cy="26" r="5" fill="#484f58"/>
  <circle cx="46" cy="26" r="5" fill="#484f58"/>
  <circle cx="64" cy="26" r="5" fill="#484f58"/>
  <line x1="0" y1="48" x2="900" y2="48" stroke="#21262d"/>

  <text class="mono" x="870" y="225" font-size="130" text-anchor="end" fill="#58a6ff" opacity="0.06">&lt;/&gt;</text>

  <text class="mono line l1" x="48" y="92" font-size="20" fill="#8b949e"><tspan fill="#a371f7">$</tspan> whoami</text>
  <text class="sans line l2" x="48" y="165" font-size="64" font-weight="700" fill="#e6edf3">Yamen Mosleh</text>
  <text class="sans line l3" x="48" y="210" font-size="28" font-weight="600" fill="url(#accent)">Full-Stack Developer</text>
  <text class="mono line l4" x="48" y="258" font-size="20" fill="#8b949e">web  /  C++ systems  /  Godot <tspan class="cursor" fill="#58a6ff">▌</tspan></text>
</svg>
